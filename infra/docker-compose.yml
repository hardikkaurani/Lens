name: lens-infra

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lens}
      POSTGRES_USER: ${POSTGRES_USER:-lens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lens_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lens-network

  redis:
    image: redis:7.4.7-alpine
    container_name: lens-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lens-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lens-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lens-network

volumes:
  postgres_data:
    name: lens_postgres_data
  redis_data:
    name: lens_redis_data
  minio_data:
    name: lens_minio_data

networks:
  lens-network:
    name: lens-network
    driver: bridge
